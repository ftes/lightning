name: E2E (Playwright)
on:
  pull_request:
jobs:
  e2e:
    name: browser suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-retries 20
    env:
      CI: true
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - run: sudo apt-get install -y libsodium-dev

      - name: Build app
        run: |
          mix deps.get
          mix compile
          mix lightning.install_runtime
      - name: Install JS dependencies (the app's assets)
        run: npm ci
        working-directory: assets
      - name: Set up e2e database
        run: bin/e2e setup

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright
          key:
            playwright-${{ runner.os }}-${{ hashFiles('test/e2e_pw/mix.lock') }}
      - name: Build the port
        working-directory: test/e2e_pw
        run: |
          mix deps.get
          MIX_ENV=test mix playwright.install -- chromium --with-deps
      - name: Run Playwright tests
        working-directory: test/e2e_pw
        run:
          mix test --only e2e || { [ $? -eq 2 ] && mix test --only e2e --failed;
          } || { [ $? -eq 2 ] && mix test --only e2e --failed; }
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test/e2e_pw/test-results
